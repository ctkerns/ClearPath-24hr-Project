[project]
name = "clearpath-backend"
version = "0.1.0"
description = "ClearPath Review API"
readme = "README.md"
authors = [
    { name = "ctkerns", email = "christopher.t.kerns@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole test run, so the database connection pool works in every test
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
